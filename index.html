<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>American Burger</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
:root{
  --black:#050505;
  --card:#111111;
  --red:#ed1c24;
  --white:#ffffff;
  --gray:#aaaaaa;
  --border:#292929;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:var(--black);
  color:white;
  font-family:Arial,sans-serif;
  padding-bottom:90px;
}

button{
  font-family:inherit;
  cursor:pointer;
}

/* HEADER */

.header{
  padding:16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  position:sticky;
  top:0;
  z-index:20;
  background:rgba(5,5,5,.96);
}

.logo img{
  width:145px;
  max-height:60px;
  object-fit:contain;
}

.cart-button{
  background:#111;
  color:white;
  border:1px solid var(--border);
  border-radius:14px;
  padding:10px 14px;
  font-size:16px;
}

/* HERO */

.hero{
  margin:10px 16px 20px;
  padding:22px 18px;
  border-radius:22px;
  border:1px solid #292929;
  background:linear-gradient(145deg,#171717,#080808);
}

.hero-small{
  color:var(--red);
  font-size:12px;
  font-weight:bold;
  letter-spacing:2px;
}

.hero h1{
  font-size:31px;
  line-height:1;
  margin:8px 0;
}

.hero p{
  color:#bbb;
  line-height:1.5;
}

.order-button{
  width:100%;
  border:none;
  background:var(--red);
  color:white;
  padding:14px;
  border-radius:14px;
  font-weight:bold;
  font-size:15px;
}

/* CATEGORY */

.title{
  font-size:21px;
  font-weight:900;
  margin:18px 16px 12px;
}

.categories{
  display:flex;
  gap:9px;
  overflow-x:auto;
  padding:0 16px 8px;
  scrollbar-width:none;
}

.categories::-webkit-scrollbar{
  display:none;
}

.category{
  white-space:nowrap;
  background:#111;
  color:#ddd;
  border:1px solid #292929;
  border-radius:13px;
  padding:10px 13px;
}

.category.active{
  background:var(--red);
  border-color:var(--red);
  color:white;
}

/* PRODUCTS */

.products{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  padding:0 16px;
}

.product{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  overflow:hidden;
}

.product img{
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
  display:block;
  background:#181818;
}

.product-placeholder{
  width:100%;
  aspect-ratio:1/1;
  background:#181818;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:45px;
}

.product-info{
  padding:11px;
}

.product-name{
  font-weight:800;
  min-height:38px;
  line-height:1.2;
}

.product-price{
  font-size:16px;
  font-weight:900;
  margin:8px 0 10px;
}

.add-button{
  width:100%;
  border:none;
  background:var(--red);
  color:white;
  border-radius:11px;
  padding:10px 5px;
  font-weight:bold;
}

/* BOTTOM */

.bottom{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:30;
  background:#090909;
  border-top:1px solid #292929;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  padding:8px 8px 10px;
}

.nav{
  border:none;
  background:none;
  color:#888;
  padding:7px;
  font-size:12px;
}

.nav span{
  display:block;
  font-size:21px;
  margin-bottom:3px;
}

.nav.active{
  color:white;
}

/* CART */

.cart-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.75);
  z-index:50;
  display:none;
  align-items:flex-end;
}

.cart-overlay.show{
  display:flex;
}

.cart{
  width:100%;
  max-height:82vh;
  overflow:auto;
  background:#111;
  border-radius:24px 24px 0 0;
  padding:18px;
}

.cart-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.close-button{
  background:#222;
  color:white;
  border:none;
  border-radius:10px;
  padding:8px 12px;
}

.cart-item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  border-bottom:1px solid #292929;
  padding:13px 0;
}

.quantity button{
  width:30px;
  height:30px;
  background:#222;
  color:white;
  border:none;
  border-radius:8px;
  font-size:18px;
}

.checkout{
  width:100%;
  margin-top:12px;
  border:none;
  border-radius:13px;
  background:var(--red);
  color:white;
  padding:14px;
  font-weight:900;
}

.empty{
  padding:25px;
  text-align:center;
  color:#aaa;
  background:#151515;
  border-radius:15px;
}

@media(min-width:700px){

  .products{
    grid-template-columns:repeat(4,1fr);
    max-width:1100px;
    margin:auto;
  }

}
</style>
</head>

<body>

<!-- HEADER -->

<header class="header">

  <div class="logo">
    <img
      src="american_burger_logo.png"
      alt="American Burger"
    >
  </div>

  <button
    class="cart-button"
    onclick="openCart()"
  >
    🛒 <span id="cartCount">0</span>
  </button>

</header>


<!-- HERO -->

<section class="hero">

  <div class="hero-small">
    REAL BURGERS. REAL TASTE.
  </div>

  <h1>
    AMERICAN<br>
    BURGER
  </h1>

  <p>
    Янги тайёрланган бургерлар, Hot Dog,
    Shawarma ва Snacks.
  </p>

  <button
    class="order-button"
    onclick="showAll()"
  >
    🛒 БУЮРТМА БЕРИШ
  </button>

</section>


<!-- MENU -->

<div class="title">
  Меню
</div>

<div
  class="categories"
  id="categories"
></div>

<div
  class="title"
  id="sectionTitle"
>
  Барча маҳсулотлар
</div>

<div
  class="products"
  id="products"
></div>


<!-- BOTTOM NAV -->

<nav class="bottom">

  <button
    class="nav active"
    onclick="showAll()"
  >
    <span>🏠</span>
    Бош саҳифа
  </button>

  <button
    class="nav"
    onclick="scrollToMenu()"
  >
    <span>🍔</span>
    Меню
  </button>

  <button
    class="nav"
    onclick="openCart()"
  >
    <span>🛒</span>
    Сават
    <b id="bottomCount">0</b>
  </button>

</nav>


<!-- CART -->

<div
  class="cart-overlay"
  id="cartOverlay"
  onclick="closeOutside(event)"
>

  <div class="cart">

    <div class="cart-header">

      <h2>
        🛒 Сават
      </h2>

      <button
        class="close-button"
        onclick="closeCart()"
      >
        ✕
      </button>

    </div>

    <div id="cartItems"></div>

    <h3 id="cartTotal">
      Жами: 0 сўм
    </h3>

    <button
      class="checkout"
      onclick="checkout()"
    >
      БУЮРТМА БЕРИШ
    </button>

  </div>

</div>


<script>

/* DESSERTS */

/* COMBO */

{

},

{

},

{

},

{
 category:"Combo",
 name:"Family Combo",
 price:294000,
 emoji:"🔥"
}

];


/* =====================================
   CATEGORIES
===================================== */

const categories = [
  "Барчаси",
  "Бургерлар",
  "Hot Dog",
  "Shawarma",
  "Snacks",
  "Drinks",
  "Dessert",
  "Combo"
];

const categoryIcons = {

  "Барчаси":"🍽️",
  "Бургерлар":"🍔",
  "Hot Dog":"🌭",
  "Shawarma":"🌯",
  "Snacks":"🍟",
  "Drinks":"🥤",
  "Dessert":"🍰",
  "Combo":"🔥"

};


/* =====================================
   CART
===================================== */

let cart = [];


/* =====================================
   MONEY
===================================== */

function money(number){

  return number
    .toLocaleString("ru-RU")
    + " сўм";

}


/* =====================================
   RENDER CATEGORIES
===================================== */

function renderCategories(){

  const box =
    document.getElementById("categories");

  box.innerHTML =
    categories.map(
      (category,index)=>`

        <button
          class="category ${index===0?"active":""}"
          onclick="filterCategory('${category}',this)"
        >

          ${categoryIcons[category]}
          ${category}

        </button>

      `
    ).join("");

}


/* =====================================
   PRODUCT CARD
===================================== */

function productCard(product,index){

  let visual;

  if(product.image){

    visual = `

      <img
        src="${product.image}"
        alt="${product.name}"
        onerror="imageError(this,'${product.emoji || "🍔"}')"
      >

    `;

  }else{

    visual = `

      <div class="product-placeholder">
        ${product.emoji || "🍔"}
      </div>

    `;

  }


  return `

    <article class="product">

      ${visual}

      <div class="product-info">

        <div class="product-name">
          ${product.name}
        </div>

        <div class="product-price">
          ${money(product.price)}
        </div>

        <button
          class="add-button"
          onclick="addToCart(${index})"
        >
          + САВАТГА
        </button>

      </div>

    </article>

  `;

}


/* =====================================
   IMAGE ERROR
===================================== */

function imageError(image,emoji){

  image.outerHTML = `

    <div class="product-placeholder">
      ${emoji}
    </div>

  `;

}


/* =====================================
   RENDER PRODUCTS
===================================== */

function renderProducts(
  list=products,
  title="Барча маҳсулотлар"
){

  document.getElementById(
    "sectionTitle"
  ).textContent = title;


  const box =
    document.getElementById("products");


  if(!list.length){

    box
.innerHTML = `
  <div class="empty">
    Бу категорияда маҳсулот йўқ.
  </div>
`;

return;
}

box.innerHTML =
  list.map(
    product =>
      productCard(
        product,
        products.indexOf(product)
      )
  ).join("");

}


/* FILTER CATEGORY */

function filterCategory(category, button){

  document
    .querySelectorAll(".category")
    .forEach(item =>
      item.classList.remove("active")
    );

  button.classList.add("active");

  if(category === "Барчаси"){

    renderProducts();

  }else{

    renderProducts(
      products.filter(
        product =>
          product.category === category
      ),
      category
    );

  }

  scrollToMenu();
}


/* SHOW ALL */

function showAll(){

  const first =
    document.querySelector(".category");

  if(first){

    filterCategory(
      "Барчаси",
      first
    );

  }

}


/* SCROLL TO MENU */

function scrollToMenu(){

  document
    .getElementById("sectionTitle")
    .scrollIntoView({
      behavior:"smooth"
    });

}


/* ADD TO CART */

function addToCart(index){

  const existing =
    cart.find(
      item => item.index === index
    );

  if(existing){

    existing.quantity++;

  }else{

    cart.push({
      index:index,
      quantity:1
    });

  }

  updateCart();

  if(
    window.Telegram &&
    Telegram.WebApp &&
    Telegram.WebApp.HapticFeedback
  ){

    Telegram.WebApp
      .HapticFeedback
      .impactOccurred("light");

  }

}


/* CHANGE QUANTITY */

function changeQuantity(index, amount){

  const item =
    cart.find(
      item => item.index === index
    );

  if(!item) return;

  item.quantity += amount;

  if(item.quantity <= 0){

    cart =
      cart.filter(
        item => item.index !== index
      );

  }

  updateCart();
  renderCart();

}


/* UPDATE CART */

function updateCart(){

  const total =
    cart.reduce(
      (sum,item) =>
        sum + item.quantity,
      0
    );

  document.getElementById(
    "cartCount"
  ).textContent = total;

  document.getElementById(
    "bottomCount"
  ).textContent = total;

}


/* OPEN CART */

function openCart(){

  renderCart();

  document
    .getElementById("cartOverlay")
    .classList.add("show");

}


/* CLOSE CART */

function closeCart(){

  document
    .getElementById("cartOverlay")
    .classList.remove("show");

}


/* CLOSE OUTSIDE */

function closeOutside(event){

  if(event.target.id === "cartOverlay"){

    closeCart();

  }

}


/* RENDER CART */

function renderCart(){

  const box =
    document.getElementById("cartItems");

  if(!cart.length){

    box.innerHTML = `
      <div class="empty">
        Сават ҳозирча бўш.
      </div>
    `;

    document.getElementById(
      "cartTotal"
    ).textContent =
      "Жами: 0 сўм";

    return;

  }

  let total = 0;

  box.innerHTML =
    cart.map(item => {

      const product =
        products[item.index];

      total +=
        product.price *
        item.quantity;

      return `
        <div class="cart-item">

          <div>
            <b>${product.name}</b>
            <br>
            <small>
              ${money(product.price)}
              ×
              ${item.quantity}
            </small>
          </div>

          <div class="quantity">

            <button
              onclick="changeQuantity(${item.index},-1)"
            >
              −
            </button>

            <span>
              ${item.quantity}
            </span>

            <button
              onclick="changeQuantity(${item.index},1)"
            >
              +
            </button>

          </div>

        </div>
      `;

    }).join("");

  document.getElementById(
    "cartTotal"
  ).textContent =
    "Жами: " + money(total);

}


/* CHECKOUT */

function checkout(){

  if(!cart.length){

    alert(
      "Аввало маҳсулот танланг."
    );

    return;

  }

  let orderText =
    cart.map(item => {

      const product =
        products[item.index];

      return (
        product.name +
        " × " +
        item.quantity
      );

    }).join("\n");

  if(
    window.Telegram &&
    Telegram.WebApp
  ){

    Telegram.WebApp.showAlert(
      "Буюртма тайёрланди!\n\n" +
      orderText +
      "\n\n" +
      "Кейинги босқичда буюртмани Telegram ботга автоматик юборишни улаймиз."
    );

  }else{

    alert(
      "Буюртма тайёрланди!"
    );

  }

}


/* START */

renderCategories();
renderProducts();


/* TELEGRAM */

if(
  window.Telegram &&
  Telegram.WebApp
){

  Telegram.WebApp.ready();
  Telegram.WebApp.expand();

}

</script>
